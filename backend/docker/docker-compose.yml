services:
  db:
    image: pgvector/pgvector:pg16
    container_name: contract_invoice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
      POSTGRES_DB: contract_invoice_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d contract_invoice_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: contract_invoice_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg2://ai_user:ai_password@db:5432/contract_invoice_db"
    ports:
      - "8000:8000"
    volumes:
      - ../app:/app/app
      - ../uploads:/app/uploads
      - /home/quan/Documents/Data:/home/quan/Documents/Data:ro

volumes:
  postgres_data:

